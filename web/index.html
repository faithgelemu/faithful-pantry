<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Track your groceries, manage expiry dates and understand your weekly spending."
  >
  <meta name="theme-color" content="#176B3A">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Faithful Pantry">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Faithful Pantry</title>
</head>

<body>
  <script src="ocr_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener("load", async () => {
      // Register on Firebase Hosting, keeping local debug runs separate.
      const isHostedApp =
        location.hostname === "faithful-pantry.web.app" ||
        location.hostname === "faithful-pantry.firebaseapp.com";

      if (!isHostedApp || !("serviceWorker" in navigator)) {
        return;
      }

      try {
        const registration = await navigator.serviceWorker.register(
          new URL("sw.js", document.baseURI),
          {
            scope: new URL("./", document.baseURI).href,
            updateViaCache: "none"
          }
        );

        console.info(
          "Faithful Pantry service worker registered:",
          registration.scope
        );
      } catch (error) {
        console.error(
          "Faithful Pantry offline setup failed:",
          error
        );
      }
    });
  </script>
</body>
</html>
