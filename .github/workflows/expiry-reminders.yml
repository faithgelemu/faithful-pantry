name: Expiry reminders

on:
  schedule:
    # Daily at 09:17 UTC:
    # 09:17 UK winter time, 10:17 UK summer time.
    - cron: "17 9 * * *"

  workflow_dispatch:
    inputs:
      send_reminder:
        description: "Send real reminders (maximum 10 attempts)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: expiry-reminders
  cancel-in-progress: false

jobs:
  reminder:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install reminder dependencies
        working-directory: tools/reminders
        run: npm ci --ignore-scripts

      - name: Test reminder rules and delivery protection
        run: >
          node --test
          tools/reminders/expiry-reminders.test.cjs
          tools/reminders/delivery-protection.test.cjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_REMINDER_SERVICE_ACCOUNT }}
          project_id: faithful-pantry

      - name: Run reminder job
        env:
          EVENT_NAME: ${{ github.event_name }}
          SEND_REMINDER: ${{ inputs.send_reminder }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$SEND_REMINDER" = "true" ]; then
            node tools/reminders/expiry-reminders.cjs --send
          else
            node tools/reminders/expiry-reminders.cjs
          fi